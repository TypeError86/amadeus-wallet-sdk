<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Amadeus dApp Demo</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #0a0b0d;
				--bg-soft: #0e1013;
				--panel: #14161b;
				--panel-2: #191c22;
				--border: #262a31;
				--border-soft: #1e222840;
				--ink: #e9edf1;
				--dim: #8c94a1;
				--faint: #5b6270;
				--accent: #45c4bf;
				--accent-ink: #04201f;
				--accent-soft: #45c4bf1a;
				--ok: #4ccf9a;
				--warn: #e0a44a;
				--err: #e57373;
				--radius: 16px;
				--mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
				--sans:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
			}
			body {
				min-height: 100dvh;
				background:
					radial-gradient(120% 80% at 50% -10%, #10201f 0%, transparent 55%),
					var(--bg);
				color: var(--ink);
				font: 15px/1.55 var(--sans);
				-webkit-font-smoothing: antialiased;
				display: flex;
				justify-content: center;
				padding: clamp(1.25rem, 5vw, 3.5rem) 1.15rem 5rem;
			}
			main {
				width: 100%;
				max-width: 448px;
				display: flex;
				flex-direction: column;
				gap: 1.15rem;
			}

			/* ---- header ---- */
			header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 1rem;
				margin-bottom: 0.15rem;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 0.6rem;
			}
			.mark {
				height: 30px;
				width: 30px;
				border-radius: 9px;
				display: grid;
				place-items: center;
				background: linear-gradient(150deg, var(--accent), #2f8f8b);
				color: var(--accent-ink);
				font-weight: 800;
				font-size: 1rem;
				box-shadow: 0 4px 14px -4px var(--accent);
			}
			h1 {
				font-size: 1.22rem;
				font-weight: 660;
				letter-spacing: -0.02em;
				margin: 0;
				line-height: 1.1;
			}
			.brand .tag {
				display: block;
				font-size: 0.72rem;
				color: var(--dim);
				font-weight: 450;
			}
			.chip {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				font-size: 0.68rem;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--dim);
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 999px;
				padding: 0.32rem 0.6rem;
			}
			.chip .dot {
				height: 6px;
				width: 6px;
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 0 3px var(--accent-soft);
			}

			/* ---- cards ---- */
			.card {
				background: linear-gradient(180deg, var(--panel-2), var(--panel));
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 1.2rem;
				display: flex;
				flex-direction: column;
				gap: 0.95rem;
				box-shadow: 0 1px 0 #ffffff08 inset, 0 12px 30px -22px #000;
			}
			.field-label {
				font-size: 0.7rem;
				font-weight: 600;
				letter-spacing: 0.07em;
				text-transform: uppercase;
				color: var(--faint);
			}
			label {
				display: flex;
				flex-direction: column;
				gap: 0.45rem;
			}
			input {
				background: var(--bg-soft);
				border: 1px solid var(--border);
				border-radius: 10px;
				color: var(--ink);
				padding: 0.62rem 0.75rem;
				font: 0.85rem var(--mono);
				transition: border-color 0.15s ease, box-shadow 0.15s ease;
			}
			input:focus-visible {
				outline: none;
				border-color: var(--accent);
				box-shadow: 0 0 0 3px var(--accent-soft);
			}

			/* ---- buttons ---- */
			button {
				font: inherit;
				cursor: pointer;
				border-radius: 11px;
				transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease,
					opacity 0.15s ease;
			}
			button:active {
				transform: translateY(1px);
			}
			.btn-primary {
				background: var(--accent);
				color: var(--accent-ink);
				border: 0;
				padding: 0.72rem 1rem;
				font-weight: 680;
				font-size: 0.92rem;
				box-shadow: 0 8px 22px -12px var(--accent);
			}
			.btn-primary:hover:not(:disabled) {
				background: #55d0cb;
			}
			.btn-ghost {
				background: transparent;
				color: var(--dim);
				border: 1px solid var(--border);
				padding: 0.5rem 0.85rem;
				font-weight: 550;
				font-size: 0.82rem;
			}
			.btn-ghost:hover:not(:disabled) {
				color: var(--ink);
				border-color: var(--faint);
			}
			button:disabled {
				opacity: 0.4;
				cursor: not-allowed;
				box-shadow: none;
			}

			/* ---- QR ---- */
			#qr {
				display: none;
				flex-direction: column;
				align-items: center;
				gap: 0.85rem;
				padding-top: 0.2rem;
			}
			.qr-tile {
				background: #fff;
				padding: 14px;
				border-radius: 14px;
				line-height: 0;
				box-shadow: 0 18px 40px -24px #000;
			}
			.qr-tile canvas {
				display: block;
				border-radius: 4px;
			}
			.qr-hint {
				font-size: 0.8rem;
				color: var(--dim);
				text-align: center;
				max-width: 30ch;
			}
			.qr-actions {
				display: flex;
				gap: 0.5rem;
				align-items: center;
				flex-wrap: wrap;
				justify-content: center;
			}
			a#link {
				color: var(--faint);
				font: 0.68rem var(--mono);
				word-break: break-all;
				text-decoration: none;
				max-width: 100%;
				text-align: center;
				line-height: 1.4;
			}
			a#link:hover {
				color: var(--dim);
			}

			/* ---- session + rows ---- */
			.row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 1rem;
				font-size: 0.86rem;
			}
			.row > span:first-child {
				color: var(--faint);
				font-size: 0.7rem;
				font-weight: 600;
				letter-spacing: 0.07em;
				text-transform: uppercase;
			}
			.mono {
				font-family: var(--mono);
				font-size: 0.78rem;
				word-break: break-all;
				text-align: right;
			}
			.ok {
				color: var(--ok);
			}

			/* ---- status ---- */
			.status {
				display: flex;
				align-items: flex-start;
				gap: 0.6rem;
				background: var(--bg-soft);
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 0.75rem 0.85rem;
				font-size: 0.8rem;
				color: var(--dim);
			}
			.status .dot {
				margin-top: 0.4rem;
				height: 7px;
				width: 7px;
				border-radius: 50%;
				background: var(--faint);
				flex: none;
				transition: background 0.2s ease, box-shadow 0.2s ease;
			}
			#log {
				margin: 0;
				font: 0.8rem/1.5 var(--sans);
				white-space: pre-wrap;
				color: inherit;
			}
			.status[data-state='wait'] {
				color: var(--ink);
			}
			.status[data-state='wait'] .dot {
				background: var(--warn);
				box-shadow: 0 0 0 3px #e0a44a22;
				animation: pulse 1.4s ease-in-out infinite;
			}
			.status[data-state='ok'] {
				color: var(--ink);
			}
			.status[data-state='ok'] .dot {
				background: var(--ok);
				box-shadow: 0 0 0 3px #4ccf9a22;
			}
			.status[data-state='err'] {
				color: #f0b4b4;
			}
			.status[data-state='err'] .dot {
				background: var(--err);
				box-shadow: 0 0 0 3px #e5737322;
			}
			@keyframes pulse {
				50% {
					opacity: 0.35;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				* {
					animation: none !important;
					transition: none !important;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<div class="brand">
					<span class="mark">A</span>
					<span>
						<h1>Amadeus dApp Demo</h1>
						<span class="tag">Connect &amp; sign over the bridge</span>
					</span>
				</div>
				<span class="chip"><span class="dot"></span>Testnet</span>
			</header>

			<div class="card">
				<label>
					<span class="field-label">Bridge relay</span>
					<input id="bridge" value="https://bridge.ama.one" spellcheck="false" />
				</label>
				<button id="connect" class="btn-primary">Connect wallet</button>

				<div id="qr">
					<div class="qr-tile"><canvas id="qrcanvas"></canvas></div>
					<p class="qr-hint">Scan with the Amadeus wallet, then approve the connection.</p>
					<div class="qr-actions">
						<button id="regen" class="btn-ghost">Regenerate</button>
						<button id="copylink" class="btn-ghost">Copy link</button>
					</div>
					<a id="link" target="_blank" rel="noreferrer"></a>
				</div>
			</div>

			<div class="card" id="session-card" style="display: none">
				<div class="row"><span>Connected</span><span id="account" class="mono ok"></span></div>
				<button id="sign" class="btn-primary" disabled>Sign test transfer · 1 AMA → self</button>
				<div class="row" id="txrow" style="display: none">
					<span>Tx hash</span><span id="txhash" class="mono ok"></span>
				</div>
			</div>

			<div class="status" id="status" data-state="idle">
				<span class="dot"></span>
				<pre id="log">Idle — enter a relay and connect.</pre>
			</div>
		</main>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
