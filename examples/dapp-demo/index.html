<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Amadeus dApp Demo</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #0c0d0f;
				--panel: #15171b;
				--border: #2a2f36;
				--ink: #e7eaed;
				--dim: #9aa2ab;
				--accent: #4cb6b2;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font:
					15px/1.55 system-ui,
					-apple-system,
					sans-serif;
				display: flex;
				justify-content: center;
				padding: 2rem 1rem 4rem;
			}
			main {
				width: 100%;
				max-width: 460px;
				display: flex;
				flex-direction: column;
				gap: 1.1rem;
			}
			h1 {
				font-size: 1.4rem;
				margin: 0;
			}
			p.sub {
				margin: 0;
				color: var(--dim);
				font-size: 0.9rem;
			}
			.card {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 14px;
				padding: 1.1rem;
				display: flex;
				flex-direction: column;
				gap: 0.8rem;
			}
			label {
				display: flex;
				flex-direction: column;
				gap: 0.35rem;
				font-size: 0.82rem;
				color: var(--dim);
			}
			input {
				background: #0c0d0f;
				border: 1px solid var(--border);
				border-radius: 8px;
				color: var(--ink);
				padding: 0.55rem 0.7rem;
				font: inherit;
			}
			button {
				background: var(--accent);
				color: #08201f;
				border: 0;
				border-radius: 10px;
				padding: 0.7rem 1rem;
				font-weight: 650;
				font-size: 0.95rem;
				cursor: pointer;
			}
			button:disabled {
				opacity: 0.4;
				cursor: not-allowed;
			}
			#qr {
				display: none;
				align-self: center;
				background: #fff;
				padding: 12px;
				border-radius: 12px;
			}
			#qr canvas {
				display: block;
			}
			a#link {
				color: var(--accent);
				font-size: 0.72rem;
				word-break: break-all;
			}
			.row {
				display: flex;
				justify-content: space-between;
				gap: 1rem;
				font-size: 0.88rem;
			}
			.row span:first-child {
				color: var(--dim);
			}
			.mono {
				font-family: ui-monospace, 'SF Mono', Menlo, monospace;
				font-size: 0.78rem;
				word-break: break-all;
			}
			pre#log {
				background: #0c0d0f;
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 0.8rem;
				font-size: 0.75rem;
				color: var(--dim);
				white-space: pre-wrap;
				min-height: 3rem;
				margin: 0;
			}
			.ok {
				color: var(--accent);
			}
		</style>
	</head>
	<body>
		<main>
			<div>
				<h1>Amadeus dApp Demo</h1>
				<p class="sub">
					Connect the Amadeus wallet by QR, then request a signature — over the bridge.
				</p>
			</div>

			<div class="card">
				<label>
					Bridge URL
					<input id="bridge" value="https://bridge.ama.one" spellcheck="false" />
				</label>
				<button id="connect">Connect wallet</button>
				<div id="qr">
					<canvas id="qrcanvas"></canvas>
					<button id="regen" style="margin-top: 12px">Regenerate QR code</button>
				</div>
				<a id="link" target="_blank" rel="noreferrer"></a>
			</div>

			<div class="card" id="session-card" style="display: none">
				<div class="row"><span>Connected</span><span id="account" class="mono"></span></div>
				<button id="sign" disabled>Sign test transfer (1 AMA → self)</button>
				<div class="row" id="txrow" style="display: none">
					<span>Tx hash</span><span id="txhash" class="mono ok"></span>
				</div>
			</div>

			<pre id="log">Idle.</pre>
		</main>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
