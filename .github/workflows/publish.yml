name: publish

# Publishes @amadeus-protocol/wallet-sdk to npm when a GitHub Release is published
# (or manually via the Actions tab). Requires:
#   - an NPM_TOKEN repo secret with publish rights to the @amadeus-protocol scope
#   - the release tag to match the version in package.json
on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org
            # No package-lock (repo uses bun for dev), so a plain install.
            - run: npm install --no-audit --no-fund
            # prepublishOnly runs build + test + lint; publishConfig sets public access.
            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
